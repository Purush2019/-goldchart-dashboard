<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PulsePlay</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1DB954">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PulsePlay">
<link rel="apple-touch-icon" href="./icon-180.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#121212;--card:#181818;--card2:#282828;--accent:#1DB954;--accent2:#1ed760;--text:#ffffff;--text2:#b3b3b3;--border:#333333}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}

/* Optional real video background for selected songs */
.song-video-backdrop{position:fixed;inset:0;z-index:0;pointer-events:none;background:#000;opacity:0;visibility:hidden;transition:opacity .35s ease,visibility .35s ease}
.song-video-backdrop.active{opacity:1;visibility:visible}
.song-video-backdrop video{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.05) contrast(1.04)}
.song-video-backdrop::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.58),rgba(18,18,18,.68) 42%,rgba(18,18,18,.96))}
.header,.search-section,.tabs,.content,.now-playing,.toast-box{position:relative}
.header,.search-section,.tabs,.content{z-index:2}
.now-playing{z-index:200}
.toast-box{z-index:9999}
.song-has-video{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.72);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:4px;padding:1px 4px;font-size:.56rem;font-weight:800;letter-spacing:.04em}
.video-side-panel{position:fixed;top:90px;right:10px;bottom:108px;width:min(430px,30vw);min-width:330px;background:#121212;border:1px solid var(--border);border-radius:12px;z-index:160;display:none;overflow:hidden;box-shadow:0 18px 60px rgba(0,0,0,.42)}
.video-side-panel.preloaded,.video-side-panel.active{display:flex;flex-direction:column}
.video-side-panel.preloaded{left:auto;right:10px;opacity:0;pointer-events:none;transform:translateX(120vw)}
.video-side-panel.active{left:auto;right:10px;opacity:1;pointer-events:auto;transform:none}
.video-side-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px}
.video-side-title{font-size:1rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.video-close{background:#2a2a2a;border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:1rem;cursor:pointer}
.video-frame-wrap{margin:0 16px;background:#000;border-radius:10px;overflow:hidden;aspect-ratio:16/9}
.video-frame-wrap iframe{width:100%;height:100%;border:0;display:block}
.video-panel-body{padding:18px 16px 120px;overflow:auto}
.switch-audio-btn{border:0;background:#2b2b2b;color:#fff;border-radius:999px;padding:12px 18px;font-weight:800;cursor:pointer}
.switch-audio-btn:hover{background:#3a3a3a}
.video-mode-controls{display:flex;align-items:center;gap:10px;margin-top:14px}
.video-mode-controls button{border:0;background:#2b2b2b;color:#fff;border-radius:999px;padding:10px 14px;font-weight:800;cursor:pointer}
.video-mode-controls button:hover{background:#3a3a3a}
.video-mode-controls .video-play-toggle{background:#fff;color:#000}
.video-song-name{margin-top:24px;font-size:1.55rem;font-weight:900;line-height:1.1}
.video-song-artist{margin-top:6px;color:var(--text2);font-size:.95rem;line-height:1.35}
.related-heading{margin-top:28px;font-size:1rem;font-weight:850}

/* Header */
.header{background:#000000;padding:14px 20px;padding-top:calc(env(safe-area-inset-top, 0px) + 14px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.header .logo{font-size:1.3rem;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:10px}
.header .logo img{width:32px;height:32px;display:block;flex-shrink:0}
.header .logo span{color:var(--text)}
.header .back-btn{background:var(--card);border:1px solid var(--border);color:var(--text2);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:.8rem}
.header .back-btn:hover{background:var(--card2)}

/* Search */
.search-section{padding:16px 20px 8px}
.search-wrap{position:relative}
.search-wrap input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:14px 14px 14px 44px;border-radius:12px;font-size:1rem;outline:none;transition:border .2s}
.search-wrap input:focus{border-color:var(--accent);background:var(--card2)}
.search-wrap .s-icon{position:absolute;left:17px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--text2);font-size:0;text-indent:-999px;overflow:hidden}
.search-wrap .s-icon::before{content:"";position:absolute;inset:1px;border:2px solid currentColor;border-radius:50%}
.search-wrap .s-icon::after{content:"";position:absolute;width:7px;height:2px;right:-1px;bottom:1px;background:currentColor;border-radius:2px;transform:rotate(45deg);transform-origin:center}
.search-wrap input{padding-right:48px}
.mic-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;background:transparent;border:1px solid transparent;color:var(--text2);cursor:pointer;padding:0;border-radius:50%;transition:all .2s;display:flex;align-items:center;justify-content:center}
.mic-btn svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.mic-btn:hover{color:var(--accent);background:rgba(29,185,84,.12);border-color:rgba(29,185,84,.22)}
.mic-btn.listening{color:var(--accent);background:rgba(29,185,84,.16);border-color:rgba(29,185,84,.4);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Tabs */
.tabs{display:flex;gap:0;padding:0 20px;border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 18px;font-size:.85rem;color:var(--text2);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:all .2s;font-weight:600}
.tab.active{color:#fff;border-bottom-color:var(--accent)}

/* Content area */
.content{padding:12px 20px 160px;min-height:50vh}

/* Section header */
.sec-title{font-size:1rem;font-weight:600;margin:16px 0 10px;display:flex;align-items:center;gap:8px}

/* Song list */
.song-list{list-style:none}
.song-item{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:8px;cursor:pointer;transition:background .2s;position:relative}
.song-item:hover,.song-item.playing{background:var(--card2)}
.song-item.playing .s-title{color:var(--accent)}
.song-item .s-art{width:48px;height:48px;border-radius:4px;object-fit:cover;flex-shrink:0;background:var(--card);position:relative}
.song-item .s-info{flex:1;min-width:0}
.song-item .s-title{font-size:.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.song-item .s-artist{font-size:.8rem;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.song-item .s-duration{font-size:.75rem;color:var(--text2);flex-shrink:0;margin-right:4px}
.song-item .s-actions{display:flex;gap:4px;flex-shrink:0;align-items:center}
.song-item .s-actions .s-play-btn{width:40px;height:40px;border-radius:50%;background:var(--accent);border:none;color:#000;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.song-item .s-actions .s-play-btn:hover{background:var(--accent2);transform:scale(1.06)}
.song-item .s-actions .s-play-btn svg{width:16px;height:16px;fill:#000}
.song-item .s-actions .s-q-btn{width:32px;height:32px;border-radius:50%;background:transparent;border:1px solid var(--border);color:var(--text2);cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.song-item .s-actions .s-q-btn:hover{border-color:var(--text);color:var(--text)}

/* Album/Playlist grid */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;margin-bottom:16px}
.card-item{background:var(--card);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s}
.card-item:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(29,185,84,.15)}
.card-item img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.card-item .c-info{padding:10px}
.card-item .c-name{font-size:.82rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-item .c-sub{font-size:.72rem;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Horizontal scroll row */
.h-scroll{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.h-scroll::-webkit-scrollbar{height:4px}
.h-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.h-scroll .card-item{min-width:140px;max-width:140px;flex-shrink:0}

/* Loading / Empty */
.loading,.empty{text-align:center;padding:40px 20px;color:var(--text2)}
.loading .spinner{display:inline-block;width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty .icon{font-size:1.35rem;margin-bottom:10px}

/* Lang pills */
.lang-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.lang-pill{background:var(--card);border:1px solid var(--border);padding:8px 16px;border-radius:20px;font-size:.82rem;cursor:pointer;transition:all .2s}
.lang-pill:hover,.lang-pill.active{background:var(--accent);border-color:var(--accent);color:#000;font-weight:700}

/* ═══ Now Playing Bar ═══ */
.now-playing{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg,#282828,#181818);border-top:1px solid var(--border);z-index:200;display:none}
.np-progress{height:3px;background:var(--border);cursor:pointer}
.np-progress .fill{height:100%;background:var(--accent);width:0;transition:width .3s linear}
.np-main{display:flex;align-items:center;padding:10px 16px;gap:12px}
.np-art{width:50px;height:50px;border-radius:8px;object-fit:cover;flex-shrink:0}
.np-info{flex:1;min-width:0}
.np-title{font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-artist{font-size:.76rem;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-controls{display:flex;align-items:center;gap:8px;flex-shrink:0}
.np-controls button{background:none;border:none;color:var(--text);cursor:pointer;font-size:1.3rem;padding:4px;transition:color .2s}
.np-controls button:hover{color:var(--accent)}
.np-controls .play-btn{width:48px;height:48px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:#000;transition:transform .1s}
.np-controls .play-btn:hover{background:#fff;transform:scale(1.06)}
.np-controls .seek-btn{font-size:1rem;opacity:.7}
.np-controls .seek-btn:hover{opacity:1;color:var(--accent)}
.np-controls .video-btn{font-size:.7rem;font-weight:800;letter-spacing:.02em;border:1px solid var(--border);border-radius:999px;padding:7px 9px;color:var(--text2)}
.np-controls .video-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(29,185,84,.12)}
.np-time{display:flex;justify-content:space-between;padding:0 16px 8px;font-size:.7rem;color:var(--text2)}

/* Queue indicator */
.queue-count{background:var(--accent);color:#fff;font-size:.65rem;padding:2px 6px;border-radius:10px;margin-left:4px}

/* God cards grid */
.god-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-bottom:20px}
.god-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 8px;text-align:center;cursor:pointer;transition:all .2s}
.god-card:hover,.god-card.active{background:var(--accent);border-color:var(--accent);color:#000;transform:translateY(-2px);box-shadow:0 4px 16px rgba(29,185,84,.25)}
.god-card .g-icon{font-size:1.15rem;margin-bottom:8px}
.god-card .g-name{font-size:.78rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.god-card.active .g-name{color:#fff}

/* Devotional language pills */
.dev-langs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.dev-lang{background:var(--card);border:1px solid var(--border);padding:6px 14px;border-radius:16px;font-size:.78rem;cursor:pointer;transition:all .2s}
.dev-lang:hover,.dev-lang.active{background:#f59e0b;border-color:#f59e0b;color:#000;font-weight:600}

/* Toast */
.toast-box{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--accent);color:#fff;padding:10px 20px;border-radius:8px;font-size:.85rem;pointer-events:auto;max-width:90vw;word-break:break-word;animation:fadeIn .3s}
.toast.success{background:#059669}
@keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

/* Load more */
.load-more-wrap{display:flex;justify-content:center;margin:10px 0 18px}
.load-more-btn{background:var(--card2);color:var(--text);border:1px solid var(--border);padding:9px 18px;border-radius:20px;cursor:pointer;font-size:.84rem;font-weight:600}
.load-more-btn:hover{border-color:var(--accent);color:var(--accent)}
.filter-row{margin-top:8px;display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.filter-row::-webkit-scrollbar{display:none}
.filter-row label{font-size:.76rem;color:var(--text2);white-space:nowrap;flex-shrink:0}
.filter-row select{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:.78rem;min-width:0;max-width:112px;text-overflow:ellipsis;flex:0 1 112px}
.filter-row .year-select{max-width:76px;flex-basis:76px}
@media(max-width:480px){
  .np-main{gap:8px;padding:8px 10px}
  .np-art{width:44px;height:44px}
  .np-controls{gap:3px}
  .np-controls button{font-size:1.05rem;padding:3px}
  .np-controls .play-btn{width:40px;height:40px}
  .np-controls .seek-btn{font-size:.95rem}
}
@media(min-width:1024px){
  body.video-mode .content{padding-right:calc(min(430px,30vw) + 34px)}
}
@media(max-width:1024px), (hover:none) and (pointer:coarse){
  .video-side-panel{inset:0;width:auto;min-width:0;border-radius:0;border:0;z-index:500;background:#0b0b0b}
  .video-side-panel.preloaded{inset:0;opacity:0;pointer-events:none;transform:translateX(120vw)}
  .video-side-panel.active{inset:0;opacity:1;pointer-events:auto;transform:none}
  .video-side-head{padding-top:calc(env(safe-area-inset-top,0px) + 14px)}
  .video-frame-wrap{margin:0;background:#000;border-radius:0;aspect-ratio:16/9}
  .video-panel-body{padding-bottom:150px}
  body.video-mode .header,body.video-mode .search-section,body.video-mode .tabs,body.video-mode .content{display:none}
}

/* Modern mobile app polish */
:root{
  --bg:#090909;
  --surface:#111111;
  --surface2:#191919;
  --surface3:#232323;
  --accent:#1DB954;
  --accent2:#1ed760;
  --warm:#f4b942;
  --text:#ffffff;
  --text2:#b8b8b8;
  --muted:#767676;
  --border:rgba(255,255,255,.09);
  --shadow:0 18px 60px rgba(0,0,0,.38);
}
html{background:var(--bg)}
body{
  background:
    linear-gradient(180deg,rgba(29,185,84,.18) 0,rgba(9,9,9,0) 260px),
    linear-gradient(180deg,#090909,#101010 55%,#090909);
  color:var(--text);
  letter-spacing:0;
}
.header{
  background:rgba(9,9,9,.88);

}
.header-copy{min-width:0}

}
.header .logo{font-size:1.22rem;font-weight:800;gap:10px}
.header .logo img{
  width:32px;
  height:32px;
  border-radius:10px;
  box-shadow:0 7px 18px rgba(29,185,84,.26);
}
.header-badge{

.search-wrap .s-icon{color:#111}
.mic-btn{right:10px;background:#111;color:#fff;border-color:transparent}
.mic-btn:hover,.mic-btn.listening{background:var(--accent);color:#050505}
.tabs{

function showToast(m){const b=document.getElementById('toast-box');const t=document.createElement('div');t.className='toast';t.textContent=m;b.appendChild(t);setTimeout(()=>t.remove(),3000)}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function decodeHtml(s){if(!s)return'';const e=document.createElement('textarea');e.innerHTML=s;return e.value}
function showTab(tab){document.querySelectorAll('.tab-content').forEach(el=>el.style.display='none');document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active',el.dataset.tab===tab));document.getElementById('tab-'+tab).style.display='block'}
function streamUrl(raw){return /^https?:\/\//i.test(raw||'')?`/.netlify/functions/stream?url=${encodeURIComponent(raw)}`:raw}
function splitNames(value){
  if(!value)return[];
  if(Array.isArray(value))return value.flatMap(splitNames);
  if(typeof value==='object')return Object.values(value).flatMap(splitNames);
  return decodeHtml(String(value)).split(/,|&|\band\b|\|/i).map(x=>x.trim()).filter(Boolean);
}
function yearOptions(){
  const currentYear=new Date().getFullYear();
  const years=[];
  for(let y=currentYear;y>=1980;y--)years.push(String(y));
  return years;
}
async function apiQuery(query){
  try{
    const r=await fetch(`${SAAVN_API}?query=${encodeURIComponent(query)}&lyrics=false&songdata=true`);
    if(!r.ok)throw new Error('http_'+r.status);
    const j=await r.json();
    return Array.isArray(j)?j:[];
  }catch(e){
    try{
      const r=await fetch(`${FALLBACK_API}?query=${encodeURIComponent(query)}`);
      const j=await r.json();
      if(Array.isArray(j))return j;
      return j?.data?.results||[];
    }catch(e2){console.warn('apiQuery failed',e2);return[];}
  }
}
async function multiQuery(queries){
  const batches=await Promise.all(queries.map(async q=>{
    const queryYear=(String(q).match(/\b(20\d{2}|19\d{2})\b/)||[])[1]||'';
    const rows=await apiQuery(q);
    return rows.map(s=>({...s,_query:q,_queryYear:queryYear}));
  }));
  const seen=new Set();const merged=[];
  batches.flat().forEach(s=>{const id=String(s.id||s.songid||s.media_url||'');if(id&&!seen.has(id)){seen.add(id);merged.push(s);}});
  return merged;
}
const HOME_CACHE_TTL=1000*60*45;
const DEFAULT_CACHE_TTL=1000*60*60*6;
function cacheKey(type,key){return `spotifyaudio:${type}:${key}`}
function readCachedSongs(type,key){
  try{
    const cached=JSON.parse(localStorage.getItem(cacheKey(type,key))||'null');
    const ttl=type==='home'?HOME_CACHE_TTL:DEFAULT_CACHE_TTL;
    if(!cached||!Array.isArray(cached.songs)||Date.now()-cached.ts>ttl)return[];
    return cached.songs;
  }catch(_){return[]}
}
function writeCachedSongs(type,key,songs){
  try{
    localStorage.setItem(cacheKey(type,key),JSON.stringify({ts:Date.now(),songs:songs.slice(0,300)}));
  }catch(_){}
}
function songIdentity(song){
  const n=normalizeSong(song);
  const clean=value=>decodeHtml(String(value||''))
    .toLowerCase()
    .replace(/\([^)]*\)|\[[^\]]*\]/g,' ')
    .replace(/\b(from|feat|featuring|official|video|lyrical|song|single|original|soundtrack|ost|movie|film|version|remix)\b/g,' ')
    .replace(/[^a-z0-9]+/g,' ')
    .trim();
  const title=clean(n.name);
  const artist=clean(n.artist).split(' ').slice(0,4).join(' ');
  return `${title}|${artist}`;
}
function uniqueSongs(songs){
  const seen=new Set();
  const out=[];
  for(const song of songs){
    const id=String(song.id||song.songid||song.media_url||song.previewUrl||'');
    const key=songIdentity(song)||id;
    if(!key||seen.has(key)||seen.has(id))continue;
    seen.add(key);
    if(id)seen.add(id);
    out.push(song);
  }
  return out;
}
function mergeSongs(base,extra){
  return uniqueSongs([...base,...extra]);
}
function monthName(){
  return new Date().toLocaleString('en-US',{month:'long'});
}
function rotateQueries(queries,seed=new Date().getHours()){
  const unique=[...new Set(queries.map(x=>x.trim()).filter(Boolean))];
  if(!unique.length)return unique;
  const offset=Math.abs(Number(seed)||0)%unique.length;
  return [...unique.slice(offset),...unique.slice(0,offset)];
}
function normalizeVideoKey(value){return decodeHtml(String(value||'')).trim().toLowerCase()}
function readCustomVideoBackgrounds(){
  try{return JSON.parse(localStorage.getItem('spotifyaudio:video-backgrounds')||'{}')||{}}
  catch(_){return{}}
}
function directVideoUrlFromSong(s){
  return s.videoUrl||
    s.video_url||
    s.canvasUrl||
    s.canvas_url||
    s.backgroundVideo||
    s.background_video||
    s.more_info?.videoUrl||
    s.more_info?.video_url||
    s.more_info?.canvasUrl||
    s.more_info?.canvas_url||
    '';
}
function videoUrlForSong(s,id,name,artist){
  const direct=directVideoUrlFromSong(s);
  if(direct)return direct;
  const custom={...VIDEO_BACKGROUNDS,...readCustomVideoBackgrounds()};
  const keys=[id,name,`${name} - ${artist}`].map(normalizeVideoKey);
  const match=Object.entries(custom).find(([key])=>keys.includes(normalizeVideoKey(key)));
  return match?.[1]||'';
}
function normalizeSong(s){
  const id=String(s.id||s.songid||s.media_url||Math.random().toString(36).slice(2));
  const name=decodeHtml(s.song||s.name||s.title||'Unknown');
  const artist=decodeHtml(s.primary_artists||s.singers||s.artistName||'Unknown Artist');
  const image=((s.image||'')+'').replace(/50x50|150x150/g,'500x500');
  const rawUrl=s.media_url||s.previewUrl||'';
  const url=streamUrl(rawUrl);
  const videoUrl=videoUrlForSong(s,id,name,artist);
  const releaseYear=(s.year||s.more_info?.year||(s.release_date||s.more_info?.release_date||'').toString().slice(0,4)||'').toString();
  const year=releaseYear||String(s._queryYear||'');
  // Build comprehensive match list for filtering, plus actor-only list for the dropdown.
  let artistsList=[];
  if(s.artistMap&&typeof s.artistMap==='object'&&!Array.isArray(s.artistMap)){
    artistsList=Object.keys(s.artistMap).map(decodeHtml);
  }else{
    const combined=[s.primary_artists,s.singers,s.featured_artists,s.starring].filter(Boolean).map(decodeHtml).join(',');
    artistsList=combined.split(',').map(a=>a.trim()).filter(Boolean);
  }
  artistsList=[...new Set(artistsList)];
  let actorsList=[
    ...splitNames(s.starring),
    ...splitNames(s.actors),
    ...splitNames(s.actor),
    ...splitNames(s.actress),
    ...splitNames(s.cast),
    ...splitNames(s.more_info?.starring),
    ...splitNames(s.more_info?.actors),
    ...splitNames(s.more_info?.cast)
  ];
  if(s.artistMap&&typeof s.artistMap==='object'&&!Array.isArray(s.artistMap)){
    Object.entries(s.artistMap).forEach(([role,value])=>{
      if(/actor|actress|cast|starring/i.test(role))actorsList.push(...splitNames(value));
    });
  }
  actorsList=[...new Set(actorsList.map(a=>a.trim()).filter(Boolean))];
  let singersList=[
    ...splitNames(s.singers),
    ...splitNames(s.primary_artists),
    ...splitNames(s.featured_artists),
    ...splitNames(s.artistName),
    ...splitNames(s.more_info?.singers),
    ...splitNames(s.more_info?.primary_artists)
  ];
  if(s.artistMap&&typeof s.artistMap==='object'&&!Array.isArray(s.artistMap)){
    Object.entries(s.artistMap).forEach(([role,value])=>{
      if(/singer|vocal|artist|primary/i.test(role)&&!/actor|actress|cast|starring/i.test(role))singersList.push(...splitNames(value));
    });
  }
  singersList=[...new Set(singersList.map(a=>a.trim()).filter(Boolean))];
  return{id,name,artist,image,url,rawUrl,urls:url?[url]:[],videoUrl,duration:parseInt(s.duration||0),year,artistsList,actorsList,singersList};
}
function artistMatchesSong(song,artist){
  if(!artist)return true;
  const target=artist.toLowerCase();
  const n=normalizeSong(song);
  const haystack=[
    n.name,
    n.artist,
    ...n.artistsList,
    song.primary_artists,
    song.singers,
    song.featured_artists,
    song.starring,
    song.album,
    song.movie,
    song.subtitle,
    song.title
  ].filter(Boolean).map(x=>decodeHtml(String(x)).toLowerCase());
  return haystack.some(value=>value===target||value.includes(target));
}
function singerMatchesSong(song,singer){
  if(!singer)return true;
  const target=singer.toLowerCase();
  const targetParts=target.split(/\s+/).filter(Boolean);
  const n=normalizeSong(song);
  const haystack=[...n.singersList,song.singers,song.primary_artists,song.featured_artists,song.artistName].filter(Boolean).map(x=>decodeHtml(String(x)).toLowerCase());
  return haystack.some(value=>{
    if(value===target||value.includes(target))return true;
    const parts=value.split(/\s+/).filter(Boolean);
    return targetParts.every(part=>parts.some(v=>v.startsWith(part)));
  });
}
function songItemHtml(s){const n=normalizeSong(s);songCache[n.id]=n;return `<li class="song-item" id="song-${esc(n.id)}" data-song-id="${esc(n.id)}" onclick="playSong('${esc(n.id)}',this)"><img class="s-art" src="${esc(n.image)}">${n.videoUrl?'<span class="song-has-video">VIDEO</span>':''}<div class="s-info"><div class="s-title">${esc(n.name)}</div><div class="s-artist">${esc(n.artist)}</div></div><div class="s-actions"><button class="s-q-btn" onclick="event.stopPropagation();addToQueue('${esc(n.id)}')">+</button><button class="s-play-btn" onclick="event.stopPropagation();playSong('${esc(n.id)}',this.closest('.song-item'))">▶</button></div></li>`}
function updateHomeDropdownsFromSongs(songs){
  const yearSel=document.getElementById('home-year-select');
  const artistSel=document.getElementById('home-hero-select');
  const singerSel=document.getElementById('home-singer-select');
  const selectedYear=yearSel.value.trim();
  const selectedArtist=artistSel.value.trim();
  const selectedSinger=singerSel.value.trim();
  const norm=songs.map(normalizeSong);
  const years=[...new Set([...yearOptions(),...norm.map(s=>s.year).filter(Boolean),selectedYear].filter(Boolean))].sort((a,b)=>Number(b)-Number(a));
  const artists=[...new Set([...norm.flatMap(s=>s.actorsList).filter(Boolean),selectedArtist].filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const singers=[...new Set([...norm.flatMap(s=>s.singersList).filter(Boolean),selectedSinger].filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  yearSel.innerHTML='<option value="">All</option>'+years.map(y=>`<option value="${esc(y)}">${esc(y)}</option>`).join('');
  artistSel.innerHTML='<option value="">All</option>'+artists.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join('');
  singerSel.innerHTML='<option value="">All</option>'+singers.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join('');
  yearSel.value=selectedYear;
  artistSel.value=selectedArtist;
  singerSel.value=selectedSinger;
}
function getHomeFilters(){
  return{
    year:document.getElementById('home-year-select').value.trim(),
    artist:document.getElementById('home-hero-select').value.trim(),
    singer:document.getElementById('home-singer-select').value.trim()
  };
}
function getFilteredHomeSongs(year,artist,singer=''){
  let filtered=uniqueSongs(homeAllSongs);
  if(year)filtered=filtered.filter(s=>normalizeSong(s).year===year);
  if(artist)filtered=filtered.filter(s=>artistMatchesSong(s,artist));
  if(singer)filtered=filtered.filter(s=>singerMatchesSong(s,singer));
  return filtered.slice().sort((a,b)=>{
    const ay=Number(normalizeSong(a).year||0);
    const by=Number(normalizeSong(b).year||0);
    if(by!==ay)return by-ay;
    return String(normalizeSong(a).name).localeCompare(String(normalizeSong(b).name));
  });
}
function renderHomeFiltered(){
  const {year,artist,singer}=getHomeFilters();
  const filtered=getFilteredHomeSongs(year,artist,singer);
  const c=document.getElementById('home-content');
  let html='';
  if(filtered.length){
    html+='<ul class="song-list">';filtered.forEach(s=>html+=songItemHtml(s));html+='</ul>';
    html+=`<div style="text-align:center;color:var(--text2);font-size:.75rem;margin:4px 0 6px">Showing ${filtered.length} of ${homeAllSongs.length} loaded</div>`;
  }else{
    html+='<div class="empty"><div class="msg">No songs match these filters yet<br><span style="font-size:.75rem">Click below to fetch more</span></div></div>';
  }
  let label='Load more songs';
  if(year&&artist&&singer)label=`Load more ${artist} ${singer} ${year} songs`;
  else if(year&&singer)label=`Load more ${singer} ${year} songs`;
  else if(artist&&singer)label=`Load more ${artist} ${singer} songs`;
  else if(year&&artist)label=`Load more ${artist} ${year} songs`;
  else if(year)label=`Load more ${currentLang} ${year} songs`;
  else if(artist)label=`Load more ${artist} songs`;
  else if(singer)label=`Load more ${singer} songs`;
  else label=`Load more ${currentLang} songs`;
  html+=`<div class="load-more-wrap"><button id="load-more-btn" class="load-more-btn" onclick="loadMoreSongs()">${esc(label)}</button></div>`;
  c.innerHTML=html;
}
function generateExtraQueries(lang,year,artist,singer=''){
  const langWords=LANG_TERMS[lang]||[lang];
  const currentYear=new Date().getFullYear();
  const q=[...((CURATED_YEAR_QUERIES[lang]||{})[year]||[])];
  if(singer&&artist&&year){
    q.push(`${artist} ${singer} ${year}`,`${artist} ${singer} songs ${year}`,`${artist} ${singer} hits ${year}`,`${artist} ${singer} ${langWords[0]} ${year}`);
    for(const lw of langWords)q.push(`${artist} ${singer} ${lw} songs ${year}`,`${artist} ${singer} ${lw} movie songs ${year}`);
    for(const seed of LANG_SEEDS[lang]||[])q.push(`${artist} ${singer} ${seed} ${year}`);
  }else if(singer&&year){
    q.push(`${singer} ${year}`,`${singer} songs ${year}`,`${singer} hits ${year}`,`${singer} ${langWords[0]} songs ${year}`,`${singer} ${langWords[0]} hits ${year}`,`${singer} movie songs ${year}`,`${singer} latest ${year}`,`${singer} top songs ${year}`,`${singer} melody ${year}`,`${singer} love songs ${year}`,`${singer} album ${year}`,`${singer} playlist ${year}`);
    for(const lw of langWords)q.push(`${singer} ${lw} movie songs ${year}`,`${singer} ${lw} melody ${year}`,`${singer} ${lw} love songs ${year}`);
    for(const seed of LANG_SEEDS[lang]||[])q.push(`${singer} ${seed} ${year}`,`${singer} ${seed} songs ${year}`);
  }else if(singer){
    q.push(`${singer}`,`${singer} songs`,`${singer} hits`,`${singer} ${langWords[0]} songs`,`${singer} latest`,`${singer} top songs`,`${singer} movie songs`,`${singer} melody`,`${singer} love songs`,`${singer} album hits`,`${singer} playlist`);
    for(const lw of langWords)q.push(`${singer} ${lw} movie songs`,`${singer} ${lw} hits`,`${singer} ${lw} melody`);
    for(const seed of LANG_SEEDS[lang]||[])q.push(`${singer} ${seed}`,`${singer} ${seed} songs`);
  }else if(artist&&year){
    q.push(`${artist} ${year}`,`${artist} songs ${year}`,`${artist} hits ${year}`,`${artist} ${langWords[0]} ${year}`,`${artist} latest ${year}`,`${artist} ${year} hits`,`${artist} movie songs ${year}`,`${artist} film songs ${year}`,`${artist} album ${year}`,`${artist} playlist ${year}`,`${artist} love songs ${year}`,`${artist} dance songs ${year}`,`${artist} melody ${year}`,`${artist} bgm songs ${year}`);
    for(const lw of langWords){
      q.push(`${artist} ${lw} songs ${year}`,`${artist} ${lw} movie songs ${year}`,`${artist} ${lw} hits ${year}`,`${artist} ${lw} film songs ${year}`,`${artist} ${lw} album ${year}`);
    }
    for(const seed of LANG_SEEDS[lang]||[]){
      q.push(`${artist} ${seed} ${year}`,`${artist} ${seed} songs ${year}`);
    }
  }else if(artist){
    q.push(artist,`${artist} ${langWords[0]}`,`${artist} songs`,`${artist} hits`,`${artist} ${langWords[0]} hits`,`${artist} new songs`,`${artist} latest`,`${artist} top songs`,`${artist} romantic`);
  }else if(year){
    for(const lw of langWords){
      q.push(`${lw} ${year}`,`${lw} hits ${year}`,`${lw} songs ${year}`,`${lw} latest ${year}`,`${lw} top ${year}`,`${lw} ${year} hits`,`${lw} movies ${year}`,`${lw} movie songs ${year}`,`${lw} film songs ${year}`,`${lw} new ${year}`,`${lw} album ${year}`,`${lw} love songs ${year}`,`${lw} melody ${year}`,`${lw} dance songs ${year}`,`${lw} romantic songs ${year}`,`${lw} viral songs ${year}`,`${lw} playlist ${year}`);
    }
    for(const seed of LANG_SEEDS[lang]||[]){
      q.push(`${seed} ${year}`,`${seed} songs ${year}`,`${seed} hits ${year}`);
    }
  }else{
    for(const lw of langWords){
      q.push(`${lw} ${currentYear} latest songs`,`${lw} latest songs ${currentYear}`,`${lw} new songs ${currentYear}`,`${lw} movie songs ${currentYear}`,`${lw} ${monthName()} ${currentYear} songs`,`${lw} trending today`,`${lw} viral songs today`,`${lw} top hits`,`${lw} new songs`,`${lw} popular`,`${lw} romantic`,`${lw} love songs`,`${lw} sad songs`,`${lw} melody`,`${lw} album hits`,`${lw} ${currentYear-1}`,`${lw} ${currentYear-2}`,`${lw} dance songs`,`${lw} party songs`,`${lw} movie songs`,`${lw} film songs`,`${lw} viral songs`,`${lw} playlist`,`${lw} best songs`,`${lw} superhit songs`);
    }
    for(const seed of LANG_SEEDS[lang]||[])q.push(`${seed} ${currentYear} songs`,`${seed} latest ${currentYear}`,`${seed} ${monthName()} ${currentYear}`,`${seed} trending today`,`${seed} songs`,`${seed} hits`,`${seed} top songs`,`${seed} movie songs`,`${seed} playlist`);
  }
  return rotateQueries(q);
}
async function loadMoreSongs(){
  if(isLoadingMore)return;
  isLoadingMore=true;
  const btn=document.getElementById('load-more-btn');
  const origLabel=btn?btn.textContent:'';
  if(btn){btn.disabled=true;btn.textContent='Loading more…';}
  const {year,artist,singer}=getHomeFilters();
  const existingIds=new Set(homeAllSongs.map(s=>String(s.id||s.songid||s.media_url||'')));
  let added=0;
  let attempts=0;
  while(added<25&&attempts<(singer?14:(year&&artist?12:10))){
    const unused=generateExtraQueries(currentLang,year,artist,singer).filter(q=>!usedQueries.has(q));
    if(!unused.length)break;
    const batch=unused.slice(0,singer?12:(year&&artist?10:8));
    batch.forEach(q=>usedQueries.add(q));
    const fresh=await multiQuery(batch);
    fresh.forEach(s=>{
      const id=String(s.id||s.songid||s.media_url||'');
      if(id&&!existingIds.has(id)){homeAllSongs.push(s);existingIds.add(id);added++;}
    });
    attempts++;
  }
  updateHomeDropdownsFromSongs(homeAllSongs);
  // Restore filter values (updateDropdowns rebuilds the option list)
  document.getElementById('home-year-select').value=year;
  document.getElementById('home-hero-select').value=artist;
  document.getElementById('home-singer-select').value=singer;
  renderHomeFiltered();
  if(added===0)showToast('No new songs from these searches — try another filter');
  else showToast(`Added ${added} new songs`);
  writeCachedSongs('home',currentLang,homeAllSongs);
  isLoadingMore=false;
}
async function ensureFilteredSongs(minCount=20){
  if(isLoadingMore)return;
  let {year,artist,singer}=getHomeFilters();
  if(!year&&!artist&&!singer){renderHomeFiltered();return;}
  if(getFilteredHomeSongs(year,artist,singer).length>=minCount){renderHomeFiltered();return;}
  isLoadingMore=true;
  const c=document.getElementById('home-content');
  c.innerHTML='<div class="loading"><span class="spinner"></span><br>Loading matching songs...</div>';
  let attempts=0;
  while(getFilteredHomeSongs(year,artist,singer).length<minCount&&attempts<(singer?12:(year&&artist?10:6))){
    const unused=generateExtraQueries(currentLang,year,artist,singer).filter(q=>!usedQueries.has(q));
    if(!unused.length)break;
    const batch=unused.slice(0,singer?10:(year&&artist?8:6));
    batch.forEach(q=>usedQueries.add(q));
    const fresh=await multiQuery(batch);
    const existingIds=new Set(homeAllSongs.map(s=>String(s.id||s.songid||s.media_url||'')));
    fresh.forEach(s=>{
      const id=String(s.id||s.songid||s.media_url||'');
      if(id&&!existingIds.has(id)){homeAllSongs.push(s);existingIds.add(id);}
    });
    attempts++;
  }
  updateHomeDropdownsFromSongs(homeAllSongs);
  document.getElementById('home-year-select').value=year;
  document.getElementById('home-hero-select').value=artist;
  document.getElementById('home-singer-select').value=singer;
  renderHomeFiltered();
  isLoadingMore=false;
}
async function loadTrending(lang){
  currentLang=lang;
  usedQueries=new Set();
  homeAllSongs=[];
  document.querySelectorAll('.lang-pill').forEach(p=>p.classList.toggle('active',p.textContent.toLowerCase()===lang));
  document.getElementById('home-year-select').value='';
  document.getElementById('home-hero-select').value='';
  document.getElementById('home-singer-select').value='';
  const currentYear=new Date().getFullYear();
  const langWords=LANG_TERMS[lang]||[lang];
  const baseQueries=LANG_QUERIES[lang]||LANG_QUERIES.hindi;
  const curatedLatest=Object.values(CURATED_YEAR_QUERIES[lang]||{}).flat();
  const latestQueries=langWords.flatMap(lw=>[
    `${lw} trending today`,
    `${lw} viral songs today`,
    `${lw} ${monthName()} ${currentYear} songs`,
    `${lw} latest songs ${currentYear}`,
    `${lw} new songs ${currentYear}`,
    `${lw} movie songs ${currentYear}`,
    `${lw} hits ${currentYear}`
  ]);
  const queries=rotateQueries([...curatedLatest,...latestQueries,...baseQueries]);
  queries.forEach(q=>usedQueries.add(q));
  const c=document.getElementById('home-content');
  const cached=readCachedSongs('home',lang);
  if(cached.length){
    homeAllSongs=cached;
    updateHomeDropdownsFromSongs(homeAllSongs);
    renderHomeFiltered();
  }else{
    c.innerHTML='<div class="loading"><span class="spinner"></span><br>Loading...</div>';
  }
  const firstBatch=queries.slice(0,2);
  const remaining=queries.slice(2);
  const firstSongs=await multiQuery(firstBatch);
  if(currentLang!==lang)return;
  homeAllSongs=mergeSongs(homeAllSongs,firstSongs);
  updateHomeDropdownsFromSongs(homeAllSongs);
  renderHomeFiltered();
  writeCachedSongs('home',lang,homeAllSongs);
  if(remaining.length){
    multiQuery(remaining).then(extra=>{
      if(currentLang!==lang||!extra.length)return;
      homeAllSongs=mergeSongs(homeAllSongs,extra);
      updateHomeDropdownsFromSongs(homeAllSongs);
      renderHomeFiltered();
      writeCachedSongs('home',lang,homeAllSongs);
    }).catch(()=>{});
  }
}
function generateSearchQueries(q){
  const base=q.trim();
  const lower=base.toLowerCase();
  const lang=Object.keys(LANG_TERMS).find(key=>LANG_TERMS[key].some(term=>lower.includes(term)))||'';
  const name=base.replace(/\b(songs?|music|hits?|movie|movies|film|films|audio|track|tracks|play|search|find|show|latest|top|best|all)\b/gi,' ').replace(/\s+/g,' ').trim();
  const searchName=name||base;
  const candidateLangs=lang?[lang]:Object.keys(LANG_TERMS).filter(key=>LANG_SEEDS[key]?.some(seed=>seed.toLowerCase().includes(searchName.toLowerCase())||searchName.toLowerCase().includes(seed.toLowerCase().split(' ')[0]))).slice(0,2);
  if(!candidateLangs.length)candidateLangs.push('tamil','hindi','telugu');
  const variants=[base,searchName,`${base} hits`,`${base} latest`,`${base} movie songs`,`${base} playlist`,`${base} top songs`,`${base} love songs`,`${base} melody`,`${base} dance songs`,`${base} 2024`,`${base} 2023`,`${base} 2022`,`${searchName} songs`,`${searchName} hits`,`${searchName} movie songs`,`${searchName} film songs`,`${searchName} album`,`${searchName} playlist`,`${searchName} love songs`,`${searchName} dance songs`,`${searchName} latest`,`${searchName} top songs`];
  for(const key of candidateLangs){
    const langWords=LANG_TERMS[key]||[key];
    for(const lw of langWords)variants.push(`${searchName} ${lw} songs`,`${searchName} ${lw} hits`,`${searchName} ${lw} movie songs`,`${searchName} ${lw} film songs`,`${searchName} ${lw} album`,`${searchName} ${lw} playlist`);
    for(const seed of LANG_SEEDS[key]||[])variants.push(`${searchName} ${seed}`,`${searchName} ${seed} songs`,`${seed} ${searchName}`,`${seed} ${searchName} songs`);
  }
  if(/vijay/i.test(searchName))variants.push('thalapathy vijay songs','vijay tamil songs','vijay movie songs','vijay anirudh songs','vijay ar rahman songs','vijay dance songs','vijay kuthu songs');
  if(lang){
    for(const seed of LANG_SEEDS[lang]||[])variants.push(`${seed} ${base}`,`${seed} songs`,`${seed} hits`);
  }
  return[...new Set(variants.map(x=>x.trim()).filter(Boolean))];
}

async function loadMoreSearchResults(){
  if(isSearchLoading||!searchQuery)return;
  isSearchLoading=true;
  const btn=document.getElementById('search-load-more-btn');
  const origLabel=btn?btn.textContent:'';
  if(btn){btn.disabled=true;btn.textContent='Loading more...';}
  const existingIds=new Set(searchSongs.map(s=>String(s.id||s.songid||s.media_url||'')));
  let added=0,attempts=0;
  while(added<18&&attempts<6){
    const unused=generateSearchQueries(searchQuery).filter(q=>!searchUsedQueries.has(q));
    if(!unused.length)break;
    const batch=unused.slice(0,8);
    batch.forEach(q=>searchUsedQueries.add(q));
    const fresh=await multiQuery(batch);
    fresh.forEach(s=>{
      const id=String(s.id||s.songid||s.media_url||'');
      if(id&&!existingIds.has(id)){searchSongs.push(s);existingIds.add(id);added++;}
    });
    attempts++;
  }
  renderSearchResults();
  if(btn){btn.disabled=false;btn.textContent=origLabel;}
  if(added===0&&searchSongs.length)showToast('No more search results found');
  isSearchLoading=false;
}

async function findSongVideo(song){
  const key=song.id||videoSearchQuery(song);
  if(videoResultCache.has(key))return videoResultCache.get(key);
  if(videoResultPending.has(key))return videoResultPending.get(key);
  const pending=(async()=>{
    const res=await fetch('/api/video/search?q='+encodeURIComponent(videoSearchQuery(song)));
    if(!res.ok)throw new Error('video search failed');
    const json=await res.json();
    const picked=bestVideoFromResults(json.videos||[]);
    videoResultCache.set(key,picked);
    videoResultPending.delete(key);
    return picked;
  })().catch(e=>{videoResultPending.delete(key);throw e;});
  videoResultPending.set(key,pending);
  return pending;
}

    try{
      const reg=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});
      const activateNewWorker=worker=>worker&&worker.postMessage({type:'SKIP_WAITING'});
      if(reg.waiting)activateNewWorker(reg.waiting);
      reg.addEventListener('updatefound',()=>{
        const worker=reg.installing;
        if(!worker)return;
        worker.addEventListener('statechange',()=>{
          if(worker.state==='installed'&&navigator.serviceWorker.controller)activateNewWorker(worker);
        });
      });
      setInterval(()=>reg.update().catch(()=>{}),60*60*1000);
    }catch(_){}
  });
}
function toggleMic(){
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  const mic=document.getElementById('mic-btn');
  if(!SpeechRecognition){showToast('Voice search is not supported on this browser');return;}
  if(isListening&&recognition){recognition.stop();return;}
  recognition=new SpeechRecognition();
  recognition.lang='en-US';
  recognition.interimResults=false;
  recognition.maxAlternatives=1;
  isListening=true;
  mic.classList.add('listening');
  showToast('Listening...');
  recognition.onresult=e=>{
    const transcript=(e.results?.[0]?.[0]?.transcript||'').trim();
    if(!transcript)return;
    const input=document.getElementById('search-input');
    input.value=transcript;
    showTab('search');
    clearTimeout(searchTimeout);
    doSearch(transcript);
  };
  recognition.onerror=e=>{
    const code=e.error||'error';
    if(code==='not-allowed'||code==='service-not-allowed')showToast('Microphone permission denied');
    else if(code==='no-speech')showToast('No speech detected');
    else showToast('Voice search failed');
  };
  recognition.onend=()=>{
    isListening=false;
    mic.classList.remove('listening');
  };
  try{recognition.start()}catch(_){isListening=false;mic.classList.remove('listening');}
}
function updatePartyDropdownsFromSongs(songs){
  const yearSel=document.getElementById('party-year-select');
  const artistSel=document.getElementById('party-hero-select');
  const singerSel=document.getElementById('party-singer-select');
  const selectedYear=yearSel.value.trim();
  const selectedArtist=artistSel.value.trim();
  const selectedSinger=singerSel.value.trim();
  const norm=songs.map(normalizeSong);
  const years=[...new Set([...yearOptions(),...norm.map(s=>s.year).filter(Boolean),selectedYear].filter(Boolean))].sort((a,b)=>Number(b)-Number(a));
  const artists=[...new Set([...norm.flatMap(s=>s.actorsList).filter(Boolean),selectedArtist].filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const singers=[...new Set([...norm.flatMap(s=>s.singersList).filter(Boolean),selectedSinger].filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  yearSel.innerHTML='<option value="">All</option>'+years.map(y=>`<option value="${esc(y)}">${esc(y)}</option>`).join('');
  artistSel.innerHTML='<option value="">All</option>'+artists.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join('');
  singerSel.innerHTML='<option value="">All</option>'+singers.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join('');
  yearSel.value=selectedYear;
  artistSel.value=selectedArtist;
  singerSel.value=selectedSinger;
}

function generatePartyQueries(lang,year,artist,singer=''){
  const langWords=LANG_TERMS[lang]||[lang];
  const seeds=LANG_SEEDS[lang]||[];
  const q=[...(PARTY_QUERIES[lang]||[])];
  const partyTerms=['party','dance','club','dj','remix','mass','kuthu','fast beat','celebration'];
  if(singer&&artist&&year){
    q.push(`${artist} ${singer} party songs ${year}`,`${artist} ${singer} dance songs ${year}`,`${artist} ${singer} hits ${year}`);
    for(const seed of seeds)q.push(`${artist} ${singer} ${seed} party ${year}`);
  }else if(singer&&year){
    q.push(`${singer} party songs ${year}`,`${singer} dance songs ${year}`,`${singer} hits ${year}`,`${singer} ${langWords[0]} party ${year}`);
    for(const lw of langWords)for(const term of partyTerms)q.push(`${singer} ${lw} ${term} songs ${year}`);
    for(const seed of seeds)q.push(`${singer} ${seed} party ${year}`,`${singer} ${seed} dance ${year}`);
  }else if(singer){
    q.push(`${singer} party songs`,`${singer} dance songs`,`${singer} hits`,`${singer} remix`,`${singer} ${langWords[0]} dance`);
    for(const lw of langWords)for(const term of partyTerms)q.push(`${singer} ${lw} ${term} songs`);
    for(const seed of seeds)q.push(`${singer} ${seed} party songs`,`${singer} ${seed} dance songs`);
  }else if(artist&&year){
    q.push(`${artist} ${year}`,`${artist} party songs ${year}`,`${artist} dance songs ${year}`,`${artist} hits ${year}`,`${artist} movie songs ${year}`);
    for(const lw of langWords)for(const term of partyTerms)q.push(`${artist} ${lw} ${term} songs ${year}`);
    for(const seed of seeds)q.push(`${artist} ${seed} party ${year}`,`${artist} ${seed} dance ${year}`);
  }else if(artist){
    q.push(`${artist} party songs`,`${artist} dance songs`,`${artist} hits`,`${artist} remix`,`${artist} mass songs`);
    for(const lw of langWords)q.push(`${artist} ${lw} party`,`${artist} ${lw} dance songs`);
  }else if(year){
    for(const lw of langWords)for(const term of partyTerms)q.push(`${lw} ${term} songs ${year}`,`${lw} ${term} hits ${year}`);
    for(const seed of seeds)q.push(`${seed} party ${year}`,`${seed} dance ${year}`,`${seed} hits ${year}`);
  }else{
    for(const lw of langWords)for(const term of partyTerms)q.push(`${lw} ${term} songs`,`${lw} ${term} hits`);
    seeds.forEach(seed=>q.push(`${seed} party songs`,`${seed} dance songs`));
    if(lang==='english'){
      ENGLISH_PARTY_ARTISTS.forEach(name=>{
        q.push(`${name} party songs`,`${name} dance hits`,`${name} club songs`,`${name} greatest hits`,`${name} album songs`,`${name} playlist`,`${name} top songs`,`${name} remix songs`);
      });
    }
  }
  return[...new Set(q.map(x=>x.trim()).filter(Boolean))];
}
async function loadPartyLang(lang){
  currentPartyLang=lang;
  partyUsedQueries=new Set();
  partyAllSongs=[];
  partyInitialized=true;
  document.querySelectorAll('#party-lang-pills .lang-pill').forEach(p=>p.classList.toggle('active',p.textContent.toLowerCase()===lang));
  document.getElementById('party-year-select').value='';
  document.getElementById('party-hero-select').value='';
  document.getElementById('party-singer-select').value='';
  const c=document.getElementById('party-content');
  const cached=readCachedSongs('party',lang);
  if(cached.length){
    partyAllSongs=cached;
    updatePartyDropdownsFromSongs(partyAllSongs);
    renderPartyFiltered();
  }else{
    c.innerHTML='<div class="loading"><span class="spinner"></span><br>Loading party songs...</div>';
  }
  const queries=generatePartyQueries(lang,'','').slice(0,8);
  queries.forEach(q=>partyUsedQueries.add(q));
  const firstSongs=await multiQuery(queries.slice(0,2));
  if(currentPartyLang!==lang)return;
  partyAllSongs=mergeSongs(partyAllSongs,firstSongs);
  updatePartyDropdownsFromSongs(partyAllSongs);
  renderPartyFiltered();
  writeCachedSongs('party',lang,partyAllSongs);
  const remaining=queries.slice(2);
  if(remaining.length){
    multiQuery(remaining).then(extra=>{
      if(currentPartyLang!==lang||!extra.length)return;
      partyAllSongs=mergeSongs(partyAllSongs,extra);
      updatePartyDropdownsFromSongs(partyAllSongs);
      renderPartyFiltered();
      writeCachedSongs('party',lang,partyAllSongs);
    }).catch(()=>{});
  }
}
async function loadMorePartySongs(){
  if(isPartyLoading)return;
  isPartyLoading=true;
  const btn=document.getElementById('party-load-more-btn');
  const origLabel=btn?btn.textContent:'';
  if(btn){btn.disabled=true;btn.textContent='Loading more...';}
  const {year,artist,singer}=getPartyFilters();
  const existingIds=new Set(partyAllSongs.map(s=>String(s.id||s.songid||s.media_url||'')));
  let added=0,attempts=0;
  while(added<10&&attempts<(singer?10:(year&&artist?8:4))){
    const unused=generatePartyQueries(currentPartyLang,year,artist,singer).filter(q=>!partyUsedQueries.has(q));
    if(!unused.length)break;
    const batch=unused.slice(0,singer?10:(year&&artist?8:6));
    batch.forEach(q=>partyUsedQueries.add(q));
    const fresh=await multiQuery(batch);
    fresh.forEach(s=>{
      const id=String(s.id||s.songid||s.media_url||'');
      if(id&&!existingIds.has(id)){partyAllSongs.push(s);existingIds.add(id);added++;}
    });
    attempts++;
  }
  updatePartyDropdownsFromSongs(partyAllSongs);
  document.getElementById('party-year-select').value=year;
  document.getElementById('party-hero-select').value=artist;
  document.getElementById('party-singer-select').value=singer;
  renderPartyFiltered();
  if(added===0)showToast('No new party songs from these searches');
  else showToast(`Added ${added} party songs`);
  if(btn){btn.disabled=false;btn.textContent=origLabel;}
  isPartyLoading=false;
}
async function ensurePartyFilteredSongs(minCount=20){
  if(isPartyLoading)return;
  const {year,artist,singer}=getPartyFilters();
  if(!year&&!artist&&!singer){renderPartyFiltered();return;}
  if(getFilteredPartySongs(year,artist,singer).length>=minCount){renderPartyFiltered();return;}
  isPartyLoading=true;
  document.getElementById('party-content').innerHTML='<div class="loading"><span class="spinner"></span><br>Loading matching party songs...</div>';
  let attempts=0;
  while(getFilteredPartySongs(year,artist,singer).length<minCount&&attempts<(singer?12:(year&&artist?10:6))){
    const unused=generatePartyQueries(currentPartyLang,year,artist,singer).filter(q=>!partyUsedQueries.has(q));
    if(!unused.length)break;
    const batch=unused.slice(0,singer?10:(year&&artist?8:6));
    batch.forEach(q=>partyUsedQueries.add(q));
    const fresh=await multiQuery(batch);
    const existingIds=new Set(partyAllSongs.map(s=>String(s.id||s.songid||s.media_url||'')));
    fresh.forEach(s=>{
      const id=String(s.id||s.songid||s.media_url||'');
      if(id&&!existingIds.has(id)){partyAllSongs.push(s);existingIds.add(id);}
    });
    attempts++;
  }
  updatePartyDropdownsFromSongs(partyAllSongs);
  document.getElementById('party-year-select').value=year;
  document.getElementById('party-hero-select').value=artist;
  document.getElementById('party-singer-select').value=singer;
  renderPartyFiltered();
  isPartyLoading=false;
}

function languageOptionsHtml(selected){return LANGUAGE_OPTIONS.map(([value,label])=>`<option value="${esc(value)}"${value===selected?' selected':''}>${esc(label)}</option>`).join('')}
function localizedQueries(queries,lang){const label=(LANGUAGE_OPTIONS.find(([value])=>value===lang)||['',lang])[1];return queries.map(q=>`${label} ${q}`)}
function categoryQueryVariants(item,lang,type){
  const label=(LANGUAGE_OPTIONS.find(([value])=>value===lang)||['',lang])[1];
  const name=item.name.replace(/^All\s+/i,'').trim();
  const seeds=item.queries||[];
  const suffixes=type==='kids'
    ? ['songs','rhymes','nursery rhymes','kids songs','baby songs','learning songs','cartoon songs','playlist','popular','latest','dance songs','bedtime songs']
    : ['bhajan','aarti','songs','devotional songs','mantra','stotram','chalisa','playlist','popular bhajans','morning bhajan','latest bhajan','temple songs'];
  const q=[...localizedQueries(seeds,lang)];
  q.push(`${label} ${name} ${type==='kids'?'kids songs':'bhajan'}`,`${label} ${name} ${type==='kids'?'rhymes':'devotional songs'}`,`${label} ${name} playlist`,`${label} ${name} popular songs`);
  for(const seed of seeds){
    for(const suffix of suffixes)q.push(`${label} ${seed} ${suffix}`);
  }
  for(const suffix of suffixes)q.push(`${label} ${name} ${suffix}`);
  return[...new Set(q.map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean))];
}
